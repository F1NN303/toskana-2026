<style id="css">
/* Layout: die Seite ist die Autobahn. Asphalt als Grund, Inhalte als echte Verkehrsschilder:
   Schilderbrücke oben, Wechselverkehrszeichen für Countdown und Nachrichten, Entfernungstafel,
   braune Touristikschilder für die Ausflüge */
:root{
  color-scheme:dark;
  --asphalt:#232527; --asphalt-hi:#2d3033; --asphalt-lo:#1a1b1d;
  --paint:#ecebe4; --paint-dim:#a9aaa7; --muted:#8c8f91;
  --yellow:#f3c316; --amber:#ffae00;
  --de:#0a5aa8; --it:#0b8549; --ch:#0b8549; --brown:#73441f; --red:#c41e2a;
  --map-land:#2e3134; --map-sea:#1b2933; --map-border:#5a5e62; --map-route:#73777b;
  --f-sign:"Overpass","Arial Narrow",Arial,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Consolas,monospace;
  --f-led:"Doto","Overpass Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;color:var(--paint);font-family:var(--f-sign);font-size:17px;line-height:1.45;
  background-color:var(--asphalt);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.3px),radial-gradient(rgba(0,0,0,.18) 1px,transparent 1.3px);
  background-size:5px 5px,7px 7px;background-position:0 0,2px 3px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:26px 56px;display:flex;flex-direction:column;gap:30px}
h1,h2,h3{margin:0;font-weight:900;line-height:1.05;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:.82rem;font-weight:600;opacity:.85}

/* Fahrbahnmarkierung als Trenner */
.lane{height:5px;background:repeating-linear-gradient(90deg,var(--paint) 0 46px,transparent 46px 80px);opacity:.5}
.edge{height:4px;background:var(--paint);opacity:.75}
.sec-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sec-title h2{font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em}
.sec-title .small{color:var(--paint-dim)}

/* Kopf */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.top h1{font-size:clamp(2.3rem,7.5vw,4.6rem);letter-spacing:-.02em}
.top h1 span{box-shadow:inset 0 -.14em 0 var(--yellow)}
.top p{color:var(--paint-dim);font-weight:600}
.ovals{display:flex;gap:8px}
.oval{display:inline-grid;place-items:center;width:52px;height:34px;border-radius:50%;background:#fff;color:#111;border:2.5px solid #111;font-weight:900;font-size:.95rem;letter-spacing:.02em;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.oval.sm{width:40px;height:26px;font-size:.75rem;border-width:2px}

/* Schilder */
.sign{--c:var(--de);background:var(--c);color:#fff;border-radius:11px;padding:5px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.sign>.in{border:3px solid #fff;border-radius:7px;padding:16px 20px}
.sign.de{--c:var(--de)} .sign.it,.sign.ch{--c:var(--it)} .sign.brown{--c:var(--brown)}
.sign.yellow{--c:var(--yellow);color:#111}
.sign.yellow>.in{border-color:#111}
.gantry{position:relative;padding-top:22px}
.gantry::before{content:"";position:absolute;top:0;left:-8px;right:-8px;height:12px;border-radius:2px;
  background:repeating-linear-gradient(135deg,#63676b 0 7px,#46494c 7px 14px)}
.gantry::after{content:"";position:absolute;top:12px;left:18%;right:18%;height:10px;
  background:linear-gradient(90deg,#55595c 0 4px,transparent 4px calc(100% - 4px),#55595c calc(100% - 4px))}

.hero-in{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:end}
@media (max-width:680px){.hero-in{grid-template-columns:minmax(0,1fr)}}
.where strong{display:block;font-size:clamp(1.9rem,5.4vw,3.2rem);font-weight:900;line-height:1;margin-top:4px}
.dest{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;border-left:3px solid rgba(255,255,255,.9);padding-left:16px}
@media (max-width:680px){.dest{border-left:0;padding-left:0;border-top:3px solid rgba(255,255,255,.9);padding-top:12px}}
.dest svg{grid-row:span 2;width:34px;height:44px}
.dest .to{font-size:1.45rem;font-weight:800;line-height:1.05}
.dest .km{font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.dest .eta{grid-column:2 / 4;font-weight:600}

/* Wechselverkehrszeichen (LED) */
.vms{background:#0b0b0b;border:7px solid #3b3e41;border-radius:5px;padding:14px 18px;color:var(--amber);
  font-family:var(--f-led);text-transform:uppercase;letter-spacing:.05em;text-shadow:0 0 7px rgba(255,174,0,.55);
  box-shadow:inset 0 0 0 1px #000,0 3px 0 rgba(0,0,0,.45)}
.vms .l1{font-size:clamp(1rem,2.8vw,1.35rem);font-weight:700}
.vms .l2{font-size:clamp(1.9rem,7.4vw,3.7rem);font-weight:900;line-height:1.05}
.vms .l3{font-size:clamp(.95rem,2.6vw,1.25rem);font-weight:700;text-transform:none;letter-spacing:.02em;margin-top:4px}

/* Fahrbahn mit Bus */
.road-wrap{display:flex;flex-direction:column;gap:6px}
.strip{position:relative;height:54px;background:var(--asphalt-lo);border-block:4px solid var(--paint)}
.strip::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,var(--paint) 0 26px,transparent 26px 50px);opacity:.8}
.strip .travelled{position:absolute;left:0;top:0;bottom:0;background:rgba(243,195,22,.22)}
.strip .bmark{position:absolute;top:-4px;bottom:-4px;border-left:3px solid var(--red)}
.strip .bus{position:absolute;top:50%;width:62px;height:30px;transform:translate(-50%,-50%);z-index:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.strip-lbl{position:relative;height:30px}
.strip-lbl .oval{position:absolute;top:0;transform:translateX(-50%)}
.strip-lbl .oval.first{transform:none}
.strip-lbl .endname{position:absolute;right:0;top:4px;font-weight:800}
.plate{display:inline-flex;align-self:flex-start;background:#fff;color:#111;border:2px solid #111;border-radius:4px;padding:4px 10px;font-weight:700;font-size:.92rem}
.plate.late{background:var(--yellow)}
.plates{display:flex;flex-wrap:wrap;gap:8px}
.plate.live{background:var(--it);color:#fff;border-color:#fff;align-items:center}
.plate.live i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;margin-right:8px;animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.plate.live i{animation:none}}
.gps{align-self:flex-start;display:inline-flex;gap:10px;align-items:center;background:var(--yellow);color:#111;font-weight:900;text-decoration:none;padding:11px 16px;border-radius:6px;border:3px solid #111;box-shadow:0 3px 0 rgba(0,0,0,.45)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:14px}

/* Karte + Tafel */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.nav{background:var(--asphalt-lo);border:2px solid #3c3f42;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.nav-head{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:.75rem;color:var(--paint-dim);text-transform:uppercase;letter-spacing:.08em}
svg.map{width:100%;height:auto;display:block}
svg.tus .lbl{font-size:12.5px;stroke-width:3.5px}
svg.tus .day{font-size:13px}
svg .land{fill:var(--map-land)}
svg .sea{fill:var(--map-sea)}
svg .alps{fill:none;stroke:#35393c;stroke-width:20;stroke-linecap:round;stroke-linejoin:round}
svg .border{fill:none;stroke:var(--map-border);stroke-width:.8;stroke-dasharray:3 2}
svg .country{fill:var(--paint-dim);font-family:var(--f-sign);font-size:7px;font-weight:800;letter-spacing:.16em;opacity:.6}
svg .region{fill:var(--paint-dim);font-family:var(--f-sign);font-size:7px;font-style:italic;opacity:.7}
svg .route{fill:none;stroke:var(--map-route);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
svg .route-alt{fill:none;stroke:var(--map-route);stroke-width:1.4;stroke-dasharray:3 3}
svg .done{fill:none;stroke:var(--yellow);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
svg .wp{fill:var(--asphalt-lo);stroke:var(--paint-dim);stroke-width:1}
svg .wp.passed{fill:var(--yellow);stroke:var(--yellow)}
svg .lbl{fill:var(--paint);font-family:var(--f-sign);font-size:8px;font-weight:800;paint-order:stroke;stroke:var(--map-land);stroke-width:2.6px}
svg .lbl.minor{font-weight:600;fill:var(--paint-dim)}
svg .busm .ring{fill:var(--amber);opacity:.3;transform-origin:center;transform-box:fill-box;animation:ping 2.2s ease-out infinite}
svg .busm .dot{fill:var(--amber);stroke:#fff;stroke-width:2}
svg .hotel{fill:var(--it);stroke:#fff;stroke-width:1.5}
svg .trip{fill:none;stroke:#a26a3c;stroke-width:1.8}
svg .trip.rail{stroke-dasharray:4 3}
svg .trip.today{stroke:var(--yellow);stroke-width:2.8}
svg .day{fill:#d8a070;font-family:var(--f-sign);font-size:9px;font-weight:900}
svg .day.today{fill:var(--yellow)}
@keyframes ping{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2);opacity:0}}
@media (prefers-reduced-motion:reduce){svg .busm .ring{animation:none}}
.key{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--paint-dim);font-family:var(--f-mono)}
.key i{display:inline-block;width:20px;border-top:3px solid var(--yellow);vertical-align:middle;margin-right:6px}
.key i.r{border-top-color:var(--map-route)}
.key i.a{border-top:2px dashed var(--map-route)}

/* Entfernungstafel */
.dist .in{display:flex;flex-direction:column;gap:6px}
.dist .head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.dist .head svg{width:26px;height:34px;flex:none}
.dist .head span{font-weight:700;font-size:.9rem}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;font-size:1.35rem;font-weight:800;border-top:2px solid rgba(255,255,255,.25);padding-top:5px}
.drow:first-of-type{border-top:0}
.drow b{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.drow.final{font-size:1.5rem}

/* Fahrplan */
.fp{list-style:none;margin:0;padding:0}
.fp li{display:grid;grid-template-columns:4.1rem 16px minmax(0,1fr) auto;gap:10px;align-items:start;padding-block:6px}
.fp .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}
.fp .t small{display:block;font-weight:500;font-size:.68rem;color:var(--muted)}
.fp .mk{position:relative;align-self:stretch;min-height:22px}
.fp .mk::before{content:"";position:absolute;left:6px;top:0;bottom:-12px;width:4px;background:repeating-linear-gradient(180deg,var(--paint-dim) 0 6px,transparent 6px 11px);opacity:.6}
.fp li:last-child .mk::before{display:none}
.fp .mk::after{content:"";position:absolute;left:1px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--asphalt);border:3px solid var(--paint-dim)}
.fp li.passed .mk::before{background:var(--yellow);opacity:1}
.fp li.passed .mk::after{background:var(--yellow);border-color:var(--yellow)}
.fp li.next .mk::after{border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,174,0,.25)}
.fp li.passed .nm,.fp li.passed .t{color:var(--muted)}
.fp .nm{font-weight:800;min-width:0}
.fp .nm small{display:block;font-weight:400;color:var(--paint-dim);font-size:.85rem}
.fp .nm .ok{color:var(--yellow);font-size:.8rem;margin-left:6px}
.fp .nm .here{display:block;color:var(--amber);font-weight:700;font-size:.85rem}
.fp .sd{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.fp .sd .num{font-size:.75rem;color:var(--muted)}
.shield{font-weight:900;font-size:.78rem;color:#fff;padding:1px 7px;border-radius:4px;border:1.5px solid #fff;white-space:nowrap;line-height:1.45}
.shield.de{background:var(--de)} .shield.ch{background:var(--red)} .shield.it{background:var(--it)}
.shield.tun{background:#111}
.fine{font-size:.85rem;color:var(--paint-dim)}

/* Woche: Touristikschilder */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 18px}
.tsign{display:flex;flex-direction:column}
.tsign .sign{flex:1}
.tsign .in{display:flex;flex-direction:column;gap:8px;height:100%}
.tsign .when{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.tsign h3{font-size:1.45rem;text-transform:uppercase;letter-spacing:0;overflow-wrap:anywhere;hyphens:auto}
.tsign h3 small{display:block;font-size:.9rem;text-transform:none;letter-spacing:0;font-weight:600;opacity:.9;margin-top:3px}
.tsign ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.93rem}
.tsign li{display:grid;grid-template-columns:4.7rem minmax(0,1fr);gap:8px}
.tsign li .num{font-size:.8rem;padding-top:2px;opacity:.85;white-space:nowrap}
.tsign .hint{font-size:.85rem;border-top:2px solid rgba(255,255,255,.35);padding-top:7px;margin-top:auto}
.tsign .post{height:18px;width:10px;margin-left:28px;background:linear-gradient(90deg,#7c8084,#5a5d60)}
.tsign.past{opacity:.5}
.tsign.today .sign{outline:4px solid var(--yellow);outline-offset:4px}
.todayplate{background:var(--yellow);color:#111;border-radius:3px;padding:0 7px;font-weight:900;letter-spacing:.04em}

/* Gut zu wissen */
.warns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 28px}
@media (max-width:860px){.warns{grid-template-columns:minmax(0,1fr)}}
.warn{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start}
.warn svg{width:52px;height:46px}
.warn h3{font-size:1.1rem;margin-bottom:3px}
.warn p{color:var(--paint-dim);font-size:.97rem}
footer{font-size:.85rem;color:var(--muted);max-width:72ch}


/* Nächstes Ereignis und Wetter */
.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:baseline;gap:4px 14px;background:var(--asphalt-hi);border-left:6px solid var(--yellow);padding:12px 16px;border-radius:4px}
.next-l{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--paint-dim)}
.next b{font-size:1.3rem;font-weight:900;min-width:0}
.next-t{font-size:1.3rem;font-weight:900;color:var(--yellow);white-space:nowrap;font-variant-numeric:tabular-nums}
.plate.wx{gap:6px;align-items:center}
.wxi{width:18px;height:18px;flex:none}
.wxline{display:flex;gap:8px;align-items:center;font-size:.88rem;background:rgba(0,0,0,.18);border-radius:5px;padding:5px 8px}
.wxline .wxi{width:22px;height:22px}
@media (max-width:600px){
  .next{grid-template-columns:minmax(0,1fr) auto;padding:10px 12px}
  .next-l{grid-column:1 / -1}
  .next b,.next-t{font-size:1.1rem}
}
/* Handy: kompakter, damit Position und Status ohne Scrollen sichtbar sind */
@media (max-width:600px){
  body{font-size:16px}
  .wrap{padding-block:14px 40px;gap:20px}
  .top{gap:6px}
  .top p{font-size:.82rem}
  .top h1{font-size:2.1rem}
  .ovals{display:none}
  .sign>.in{padding:12px 14px}
  .gantry{padding-top:16px}
  .gantry::before{height:9px}
  .gantry::after{top:9px;height:7px}
  .where strong{font-size:1.65rem}
  .hero-in{gap:12px}
  .dest{gap:2px 10px;padding-top:10px}
  .dest svg{width:24px;height:32px}
  .dest .to{font-size:1.1rem}
  .dest .km{font-size:1.45rem}
  .dest .eta{font-size:.9rem}
  .vms{padding:10px 12px;border-width:5px}
  .vms .l2{font-size:1.9rem}
  .strip{height:44px}
  .strip .bus{width:50px;height:24px}
  .plate{font-size:.85rem}
  .sec-title h2{font-size:1.25rem}
  .drow{font-size:1.15rem}
  .drow.final{font-size:1.25rem}
  .fp li{grid-template-columns:3.6rem 16px minmax(0,1fr) auto;gap:8px}
  .tsign h3{font-size:1.3rem}
  .nav-head{font-size:.66rem;letter-spacing:.04em}
  .nav-head span{white-space:nowrap}
}
</style>

  var q='[out:json][timeout:15];(nwr(around:700,'+la+','+lo+')["highway"~"^(services|rest_area)$"];nwr(around:300,'+la+','+lo+')["amenity"="fuel"];);out center tags;';
  fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q)).then(function(r){return r.ok?r.json():null}).then(function(j){
    if(!j){delete stopPending[k];return}
    var best=null, fuelName='';
    (j.elements||[]).forEach(function(el){
      var y=el.lat!=null?el.lat:(el.center&&el.center.lat), x=el.lon!=null?el.lon:(el.center&&el.center.lon);
      if(y==null)return;
      var t=el.tags||{}, kind=t.highway==='services'?'Raststätte':(t.highway==='rest_area'?'Rastplatz':'Tankstelle');
      var name=t.name||t.brand||t.operator||'', rank=kind==='Raststätte'?0:(kind==='Tankstelle'?1:2), d=kmDist(la,lo,y,x);
      if(kind==='Tankstelle'&&name&&!fuelName)fuelName=name;
      var c={kind:kind,name:name,d:d,rank:rank};
      if(!best||c.rank<best.rank||(c.rank===best.rank&&c.d<best.d))best=c;
    });
    if(best&&!best.name&&fuelName)best.name=fuelName;
    stopCache[k]=best; delete stopPending[k]; render();
  }).catch(function(){delete stopPending[k]});
}
function stopText(now){
  var mins=gps.stoppedSince?Math.max(1,Math.round((now-gps.stoppedSince)/60000)):null;

  if(place===undefined)return 'Bus steht'+since;
  if(place===null)return 'Bus steht'+since+', keine Raststätte in der Nähe (vermutlich Stau)';
  var label=/rast|area|autogrill|services|aire|tankstelle|stazione/i.test(place.name)?place.name:(place.kind+(place.name?' '+place.name:''));
  return (mins!==null&&mins<15?'Kurzer Halt':'Pause')+': '+label+since;
}
function useGps(p){
  if(!p||typeof p!=='object')return;
  var lat=+p.lat,lon=+p.lon,t=toMs(p.t);
  if(!isFinite(lat)||!isFinite(lon)||!isFinite(t)||Math.abs(lat)>90||Math.abs(lon)>180||(lat===0&&lon===0)){lat=0;lon=0;t=0}
  var prev=gps, sp=+p.speed;
  if(!(isFinite(sp)&&p.speed!==null&&p.speed!==undefined&&sp>=0)){sp=null;if(prev&&prev.t&&t>prev.t&&t-prev.t>=20000&&t-prev.t<=600000)sp=kmDist(prev.lat,prev.lon,lat,lon)/((t-prev.t)/3600000)}
  if(prev&&prev.t===t)sp=prev.speed;
  gps={speed:sp,lat:lat,lon:lon,t:t,acc:+p.acc||null,stopped:!!p.stopped,stoppedSince:p.stoppedSince?toMs(p.stoppedSince):null,msg:typeof p.msg==='string'?p.msg.slice(0,200):'',msgAt:p.msgAt?toMs(p.msgAt):null};
  lookupStop();
  render();
}
function pullGps(){
  if(!window.fetch||location.protocol==='file:')return;
  fetch(GPS_API,{cache:'no-store',headers:{'Accept':'application/vnd.github.raw+json'}}).then(function(r){
    if(r.ok)return r.json();

  }).then(useGps).catch(function(){});
}
