<style id="css">
/* Layout: die Seite ist die Autobahn. Asphalt als Grund, Inhalte als echte Verkehrsschilder:
   Schilderbrücke oben, Wechselverkehrszeichen für Countdown und Nachrichten, Entfernungstafel,
   braune Touristikschilder für die Ausflüge, gelbe Baustellentafel für die Lehrkräfte. */
:root{
  color-scheme:dark;
  --asphalt:#232527; --asphalt-hi:#2d3033; --asphalt-lo:#1a1b1d;
  --paint:#ecebe4; --paint-dim:#a9aaa7; --muted:#8c8f91;
  --yellow:#f3c316; --amber:#ffae00;
  --de:#0a5aa8; --it:#0b8549; --ch:#0b8549; --brown:#73441f; --red:#c41e2a;
  --map-land:#2e3134; --map-sea:#1b2933; --map-border:#5a5e62; --map-route:#73777b;
  --f-sign:"Overpass","Arial Narrow",Arial,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Consolas,monospace;
  --f-led:"Doto","Overpass Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;color:var(--paint);font-family:var(--f-sign);font-size:17px;line-height:1.45;
  background-color:var(--asphalt);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.3px),radial-gradient(rgba(0,0,0,.18) 1px,transparent 1.3px);
  background-size:5px 5px,7px 7px;background-position:0 0,2px 3px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:26px 56px;display:flex;flex-direction:column;gap:30px}
h1,h2,h3{margin:0;font-weight:900;line-height:1.05;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:.82rem;font-weight:600;opacity:.85}

/* Fahrbahnmarkierung als Trenner */
.lane{height:5px;background:repeating-linear-gradient(90deg,var(--paint) 0 46px,transparent 46px 80px);opacity:.5}
.edge{height:4px;background:var(--paint);opacity:.75}
.sec-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sec-title h2{font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em}
.sec-title .small{color:var(--paint-dim)}

/* Kopf */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.top h1{font-size:clamp(2.3rem,7.5vw,4.6rem);letter-spacing:-.02em}
.top h1 span{box-shadow:inset 0 -.14em 0 var(--yellow)}
.top p{color:var(--paint-dim);font-weight:600}
.ovals{display:flex;gap:8px}
.oval{display:inline-grid;place-items:center;width:52px;height:34px;border-radius:50%;background:#fff;color:#111;border:2.5px solid #111;font-weight:900;font-size:.95rem;letter-spacing:.02em;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.oval.sm{width:40px;height:26px;font-size:.75rem;border-width:2px}

/* Schilder */
.sign{--c:var(--de);background:var(--c);color:#fff;border-radius:11px;padding:5px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.sign>.in{border:3px solid #fff;border-radius:7px;padding:16px 20px}
.sign.de{--c:var(--de)} .sign.it,.sign.ch{--c:var(--it)} .sign.brown{--c:var(--brown)}
.sign.yellow{--c:var(--yellow);color:#111}
.sign.yellow>.in{border-color:#111}
.gantry{position:relative;padding-top:22px}
.gantry::before{content:"";position:absolute;top:0;left:-8px;right:-8px;height:12px;border-radius:2px;
  background:repeating-linear-gradient(135deg,#63676b 0 7px,#46494c 7px 14px)}
.gantry::after{content:"";position:absolute;top:12px;left:18%;right:18%;height:10px;
  background:linear-gradient(90deg,#55595c 0 4px,transparent 4px calc(100% - 4px),#55595c calc(100% - 4px))}

.hero-in{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:end}
@media (max-width:680px){.hero-in{grid-template-columns:minmax(0,1fr)}}
.where strong{display:block;font-size:clamp(1.9rem,5.4vw,3.2rem);font-weight:900;line-height:1;margin-top:4px}
.dest{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;border-left:3px solid rgba(255,255,255,.9);padding-left:16px}
@media (max-width:680px){.dest{border-left:0;padding-left:0;border-top:3px solid rgba(255,255,255,.9);padding-top:12px}}
.dest svg{grid-row:span 2;width:34px;height:44px}
.dest .to{font-size:1.45rem;font-weight:800;line-height:1.05}
.dest .km{font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.dest .eta{grid-column:2 / 4;font-weight:600}

/* Wechselverkehrszeichen (LED) */
.vms{background:#0b0b0b;border:7px solid #3b3e41;border-radius:5px;padding:14px 18px;color:var(--amber);
  font-family:var(--f-led);text-transform:uppercase;letter-spacing:.05em;text-shadow:0 0 7px rgba(255,174,0,.55);
  box-shadow:inset 0 0 0 1px #000,0 3px 0 rgba(0,0,0,.45)}
.vms .l1{font-size:clamp(1rem,2.8vw,1.35rem);font-weight:700}
.vms .l2{font-size:clamp(1.9rem,7.4vw,3.7rem);font-weight:900;line-height:1.05}
.vms .l3{font-size:clamp(.95rem,2.6vw,1.25rem);font-weight:700;text-transform:none;letter-spacing:.02em;margin-top:4px}

/* Fahrbahn mit Bus */
.road-wrap{display:flex;flex-direction:column;gap:6px}
.strip{position:relative;height:54px;background:var(--asphalt-lo);border-block:4px solid var(--paint)}
.strip::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,var(--paint) 0 26px,transparent 26px 50px);opacity:.8}
.strip .travelled{position:absolute;left:0;top:0;bottom:0;background:rgba(243,195,22,.22)}
.strip .bmark{position:absolute;top:-4px;bottom:-4px;border-left:3px solid var(--red)}
.strip .bus{position:absolute;top:50%;width:62px;height:30px;transform:translate(-50%,-50%);z-index:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.strip-lbl{position:relative;height:30px}
.strip-lbl .oval{position:absolute;top:0;transform:translateX(-50%)}
.strip-lbl .oval.first{transform:none}
.strip-lbl .endname{position:absolute;right:0;top:4px;font-weight:800}
.plate{display:inline-flex;align-self:flex-start;background:#fff;color:#111;border:2px solid #111;border-radius:4px;padding:4px 10px;font-weight:700;font-size:.92rem}
.plate.late{background:var(--yellow)}
.gps{align-self:flex-start;display:inline-flex;gap:10px;align-items:center;background:var(--yellow);color:#111;font-weight:900;text-decoration:none;padding:11px 16px;border-radius:6px;border:3px solid #111;box-shadow:0 3px 0 rgba(0,0,0,.45)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:14px}

/* Karte + Tafel */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.nav{background:var(--asphalt-lo);border:2px solid #3c3f42;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.nav-head{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:.75rem;color:var(--paint-dim);text-transform:uppercase;letter-spacing:.08em}
svg.map{width:100%;height:auto;display:block}
svg.tus .lbl{font-size:12.5px;stroke-width:3.5px}
svg.tus .day{font-size:13px}
svg .land{fill:var(--map-land)}
svg .sea{fill:var(--map-sea)}
svg .alps{fill:none;stroke:#35393c;stroke-width:20;stroke-linecap:round;stroke-linejoin:round}
svg .border{fill:none;stroke:var(--map-border);stroke-width:.8;stroke-dasharray:3 2}
svg .country{fill:var(--paint-dim);font-family:var(--f-sign);font-size:7px;font-weight:800;letter-spacing:.16em;opacity:.6}
svg .region{fill:var(--paint-dim);font-family:var(--f-sign);font-size:7px;font-style:italic;opacity:.7}
svg .route{fill:none;stroke:var(--map-route);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
svg .route-alt{fill:none;stroke:var(--map-route);stroke-width:1.4;stroke-dasharray:3 3}
svg .done{fill:none;stroke:var(--yellow);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
svg .wp{fill:var(--asphalt-lo);stroke:var(--paint-dim);stroke-width:1}
svg .wp.passed{fill:var(--yellow);stroke:var(--yellow)}
svg .lbl{fill:var(--paint);font-family:var(--f-sign);font-size:8px;font-weight:800;paint-order:stroke;stroke:var(--map-land);stroke-width:2.6px}
svg .lbl.minor{font-weight:600;fill:var(--paint-dim)}
svg .busm .ring{fill:var(--amber);opacity:.3;transform-origin:center;transform-box:fill-box;animation:ping 2.2s ease-out infinite}
svg .busm .dot{fill:var(--amber);stroke:#fff;stroke-width:2}
svg .hotel{fill:var(--it);stroke:#fff;stroke-width:1.5}
svg .trip{fill:none;stroke:#a26a3c;stroke-width:1.8}
svg .trip.rail{stroke-dasharray:4 3}
svg .trip.today{stroke:var(--yellow);stroke-width:2.8}
svg .day{fill:#d8a070;font-family:var(--f-sign);font-size:9px;font-weight:900}
svg .day.today{fill:var(--yellow)}
@keyframes ping{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2);opacity:0}}
@media (prefers-reduced-motion:reduce){svg .busm .ring{animation:none}}
.key{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--paint-dim);font-family:var(--f-mono)}
.key i{display:inline-block;width:20px;border-top:3px solid var(--yellow);vertical-align:middle;margin-right:6px}
.key i.r{border-top-color:var(--map-route)}
.key i.a{border-top:2px dashed var(--map-route)}

/* Entfernungstafel */
.dist .in{display:flex;flex-direction:column;gap:6px}
.dist .head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.dist .head svg{width:26px;height:34px;flex:none}
.dist .head span{font-weight:700;font-size:.9rem}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;font-size:1.35rem;font-weight:800;border-top:2px solid rgba(255,255,255,.25);padding-top:5px}
.drow:first-of-type{border-top:0}
.drow b{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.drow.final{font-size:1.5rem}

/* Fahrplan */
.fp{list-style:none;margin:0;padding:0}
.fp li{display:grid;grid-template-columns:4.1rem 16px minmax(0,1fr) auto;gap:10px;align-items:start;padding-block:6px}
.fp .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}
.fp .t small{display:block;font-weight:500;font-size:.68rem;color:var(--muted)}
.fp .mk{position:relative;align-self:stretch;min-height:22px}
.fp .mk::before{content:"";position:absolute;left:6px;top:0;bottom:-12px;width:4px;background:repeating-linear-gradient(180deg,var(--paint-dim) 0 6px,transparent 6px 11px);opacity:.6}
.fp li:last-child .mk::before{display:none}
.fp .mk::after{content:"";position:absolute;left:1px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--asphalt);border:3px solid var(--paint-dim)}
.fp li.passed .mk::before{background:var(--yellow);opacity:1}
.fp li.passed .mk::after{background:var(--yellow);border-color:var(--yellow)}
.fp li.next .mk::after{border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,174,0,.25)}
.fp li.passed .nm,.fp li.passed .t{color:var(--muted)}
.fp .nm{font-weight:800;min-width:0}
.fp .nm small{display:block;font-weight:400;color:var(--paint-dim);font-size:.85rem}
.fp .nm .ok{color:var(--yellow);font-size:.8rem;margin-left:6px}
.fp .nm .here{display:block;color:var(--amber);font-weight:700;font-size:.85rem}
.fp .sd{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.fp .sd .num{font-size:.75rem;color:var(--muted)}
.shield{font-weight:900;font-size:.78rem;color:#fff;padding:1px 7px;border-radius:4px;border:1.5px solid #fff;white-space:nowrap;line-height:1.45}
.shield.de{background:var(--de)} .shield.ch{background:var(--red)} .shield.it{background:var(--it)}
.shield.tun{background:#111}
.fine{font-size:.85rem;color:var(--paint-dim)}

/* Woche: Touristikschilder */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 18px}
.tsign{display:flex;flex-direction:column}
.tsign .sign{flex:1}
.tsign .in{display:flex;flex-direction:column;gap:8px;height:100%}
.tsign .when{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.tsign h3{font-size:1.45rem;text-transform:uppercase;letter-spacing:0;overflow-wrap:anywhere;hyphens:auto}
.tsign h3 small{display:block;font-size:.9rem;text-transform:none;letter-spacing:0;font-weight:600;opacity:.9;margin-top:3px}
.tsign ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.93rem}
.tsign li{display:grid;grid-template-columns:4.7rem minmax(0,1fr);gap:8px}
.tsign li .num{font-size:.8rem;padding-top:2px;opacity:.85;white-space:nowrap}
.tsign .hint{font-size:.85rem;border-top:2px solid rgba(255,255,255,.35);padding-top:7px;margin-top:auto}
.tsign .post{height:18px;width:10px;margin-left:28px;background:linear-gradient(90deg,#7c8084,#5a5d60)}
.tsign.past{opacity:.5}
.tsign.today .sign{outline:4px solid var(--yellow);outline-offset:4px}
.todayplate{background:var(--yellow);color:#111;border-radius:3px;padding:0 7px;font-weight:900;letter-spacing:.04em}

/* Gut zu wissen */
.warns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px}
@media (max-width:700px){.warns{grid-template-columns:minmax(0,1fr)}}
.warn{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start}
.warn svg{width:52px;height:46px}
.warn h3{font-size:1.1rem;margin-bottom:3px}
.warn p{color:var(--paint-dim);font-size:.97rem}
footer{font-size:.85rem;color:var(--muted);max-width:72ch}

/* Lehrkräfte: Baustellentafel */
.panel .in{display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:1.4rem;text-transform:uppercase}
.panel .row{display:flex;flex-wrap:wrap;gap:12px}
.panel label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:800;flex:1 1 200px;min-width:0}
.panel input,.panel select{font:inherit;font-weight:600;padding:8px 10px;border-radius:4px;border:2px solid #111;background:#fff;color:#111;width:100%;min-width:0;color-scheme:light}
.wpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.panel button{font:inherit;font-weight:800;padding:8px 11px;border-radius:4px;border:2px solid #111;background:#fff;color:#111;cursor:pointer;text-align:left}
.panel button.dark{background:#111;color:var(--yellow)}
.panel button.reported{background:#111;color:#fff}
.panel button:disabled{opacity:.45;cursor:default}
.panel button small{display:block;font-weight:500;font-size:.75rem;opacity:.8}
.panel .actions{display:flex;flex-wrap:wrap;gap:8px}
.panel .lead{font-weight:600}
#t-status{font-weight:900;min-height:1.4em}
</style>

function estimate(phase,now){
  var r=route(phase), start=startOf(phase), total=r[r.length-1].off;
  var cks=state.checkins.filter(function(c){return c.phase===phase&&r.some(function(w){return w.id===c.wp})}).sort(function(a,b){return a.t-b.t});
  var ck=cks.length?cks[cks.length-1]:null, delay=0, minOff=0;
  if(ck){var w=r.filter(function(x){return x.id===ck.wp})[0];delay=(ck.t-start)/60000-w.off;minOff=w.off}
  var eff=(now-start)/60000-delay;
  eff=Math.max(minOff,Math.min(total,eff)); if(eff<0)eff=0;
  var i=0; while(i<r.length-2&&r[i+1].off<=eff)i++;
  var a=r[i], b=r[i+1], f=Math.max(0,Math.min(1,(eff-a.off)/(b.off-a.off)));
  var done=(ck&&ck.wp===r[r.length-1].id)||eff>=total;
  return {phase:phase,r:r,start:start,total:total,ck:ck,cks:cks,delay:delay,eff:eff,i:i,a:a,b:b,f:f,done:done,
    lat:a.lat+(b.lat-a.lat)*f,lon:a.lon+(b.lon-a.lon)*f,km:a.km+(b.km-a.km)*f,kmTotal:r[r.length-1].km,
    remain:total-eff,eta:now+(total-eff)*60000};
}
function phaseNow(now){
  if(now<HIN_START)return 'vorher';
  if(now<RUECK_START)return estimate('hin',now).done?'vorort':'hin';
  return estimate('rueck',now).done?'zuhause':'rueck';
}

function whereText(e){
  var a=e.a,b=e.b;

  var ee=e||estimate(rp,now), r=ee.r, start=ee.start, all=ph==='zuhause';
  var ckBy={};ee.cks.forEach(function(c){ckBy[c.wp]=c});
  var h='<div class="sec-title"><h2>'+(rp==='hin'?'Fahrplan Hinfahrt':'Fahrplan Rückfahrt')+'</h2><span class="small">'+(rp==='hin'?'So 22:30 → Mo ca. 14:00':'Fr 08:00 → ca. 23:30')+'</span></div><ol class="fp">';
  r.forEach(function(w,k){
    var passed=all||(ph!=='vorher'&&ph!=='vorort'&&(k<=ee.i&&ee.eff>w.off||ee.done));
    var next=!all&&(ph==='hin'||ph==='rueck')&&!ee.done&&k===ee.i+1;
    var ck=ckBy[w.id], t=ck?ck.t:start+(w.off+(ph==='vorher'||ph==='vorort'?0:Math.max(0,ee.delay)))*60000;
    h+='<li class="'+(passed?'passed':'')+(next?' next':'')+'"><span class="t">'+tm(t)+'<small>'+(ck?'gemeldet':(k===0?'Abfahrt':'ca.'))+'</small></span><span class="mk"></span>';
    h+='<span class="nm">'+esc(w.n)+(ck?'<span class="ok">✓ gemeldet</span>':'')+(w.sub?'<small>'+esc(w.sub)+'</small>':'')+(next?'<span class="here">Als Nächstes, noch ca. '+dur(w.off-ee.eff)+'</span>':'')+'</span>';
    h+='<span class="sd">'+shield(w.road)+'<span class="num">'+n1(w.km)+' km</span></span></li>';
  });
  return h+'</ol><p class="fine">Ab Parma gibt es zwei Wege: am Meer entlang über La Spezia (A15, A12) oder über Bologna und Florenz (A1). Auf der Karte ist der andere Weg gestrichelt.</p>';
}
function week(now){
  var today=berlinDate(now);
  return DAYS.map(function(d){
    var cls=d.date===today?' today':(d.date<today?' past':'');
    return '<article class="tsign'+cls+'"><div class="sign '+d.sign+'"><div class="in"><div class="when"><span>'+d.wd+' '+d.dm+'</span>'+(d.date===today?'<span class="todayplate">Heute</span>':'')+'</div>'+
      '<h3>'+esc(d.title)+'<small>'+esc(d.sub)+'</small></h3><ul>'+d.items.map(function(it){return '<li><span class="num">'+esc(it[0])+'</span><span>'+esc(it[1])+'</span></li>'}).join('')+'</ul>'+
      (d.note?'<p class="hint">'+esc(d.note)+'</p>':'')+'</div></div><div class="post"></div></article>';
  }).join('');
}

function render(){
  var now=Date.now(), ph=phaseNow(now), e=null;
  if(ph==='hin'||ph==='rueck')e=estimate(ph,now);
  var today=berlinDate(now), D=DAYS.filter(function(d){return d.date===today})[0];
  document.getElementById('s-hero').innerHTML=hero(ph,now,e);
  document.getElementById('s-map').innerHTML=mainMap(ph,e);
  document.getElementById('s-dist').innerHTML=distSign(ph,now,e);
  document.getElementById('s-tl').innerHTML=timeline(ph,now,e);
  document.getElementById('s-tus').innerHTML=tuscanyMap(ph==='vorort'&&D?D.place:null,e);
  document.getElementById('s-week').innerHTML=week(now);
  document.getElementById('s-upd').textContent=dy(now)+' '+tm(now);
}

/* Statische Version: Meldungen kommen aus status.json neben der Seite */
function toMs(v){return typeof v==='number'?v:Date.parse(v)}
function pullStatus(){
  if(!window.fetch||location.protocol==='file:')return;
  fetch('status.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(s){
    if(!s||typeof s!=='object')return;
    if(Array.isArray(s.checkins))state.checkins=s.checkins.filter(function(c){return c&&P[c.wp]&&(c.phase==='hin'||c.phase==='rueck')}).map(function(c){return {phase:c.phase,wp:c.wp,t:toMs(c.t)}}).filter(function(c){return !isNaN(c.t)});
    state.message=typeof s.message==='string'?s.message.slice(0,200):'';
    state.messageAt=s.messageAt?toMs(s.messageAt):null;
    state.gpsLink=typeof s.gpsLink==='string'&&/^https:\/\/[^\s"'<>]+$/.test(s.gpsLink)?s.gpsLink:'';
    if(s.variant){state.variant.hin=s.variant.hin==='bologna'?'bologna':'cisa';state.variant.rueck=s.variant.rueck==='bologna'?'bologna':'cisa'}
    render();
  }).catch(function(){});
}
if(!(window.claude&&typeof window.claude.use==='function')){pullStatus();setInterval(pullStatus,60000)}

/* Lehrkraft-Bereich: nur für Personen mit Bearbeitungsrecht */
var art=null;
function buildHtml(next){
  var reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}';
  var json=JSON.stringify(next).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '\n'+document.getElementById('fonts').outerHTML+'\n'+
    '<style id="css">'+document.getElementById('css').textContent+'</style>\n'+
    '<script type="application/json" id="state">'+json+'<\/script>\n<div id="app"></div>\n'+
    '<script id="app-js">'+document.getElementById('app-js').textContent+'<\/script></body></html>';
}
function clone(){return JSON.parse(JSON.stringify(state))}
function setStatus(t){var el=document.getElementById('t-status');if(el)el.textContent=t}
function lock(b){document.querySelectorAll('#teacher button,#teacher select,#teacher input').forEach(function(x){x.disabled=b})}
function save(mut){
  var next=clone();mut(next);
  try{sessionStorage.setItem('tl-draft',JSON.stringify({msg:document.getElementById('t-msg').value,gps:document.getElementById('t-gps').value}))}catch(e){}
  lock(true);setStatus('Wird gespeichert …');
  art.publish(buildHtml(next)).then(function(){setStatus('Gespeichert. Die Seite lädt für alle neu.')},function(err){
    var c=err&&err.code;
    if(c==='conflict'){setStatus('Gerade hat jemand anderes gespeichert. Die Seite lädt neu, bitte danach nochmal melden.');return}
    if(['not_writer','not_granted','not_declared','consent_required','capability_disabled','capability_removed'].indexOf(c)>=0){setStatus('Du kannst die Seite nur ansehen. Melden geht nur mit Bearbeitungsrecht.');return}
    if(c==='rate_limited'){setStatus('Zu viele Meldungen hintereinander. Bitte in einer Minute nochmal tippen.');lock(false);return}
    setStatus('Speichern hat nicht geklappt'+(c?' ('+c+')':'')+'. Bitte nochmal tippen.');lock(false);
  });
}
function pickTime(){
  var v=document.getElementById('t-time').value, now=Date.now();
  if(!v)return now;
  var t=Date.parse(berlinDate(now)+'T'+v+':00+02:00');
  if(t>now+5*60000)t-=86400000;
  return t;
}
function panelPhase(){var ph=phaseNow(Date.now());return ph==='rueck'||ph==='vorort'||ph==='zuhause'?'rueck':'hin'}
function renderWps(){
  var phase=document.getElementById('t-phase').value, r=route(phase);
  var done={};state.checkins.forEach(function(c){if(c.phase===phase)done[c.wp]=c});
  document.getElementById('t-wps').innerHTML=r.map(function(w){var c=done[w.id];return '<button type="button" data-wp="'+w.id+'" class="'+(c?'reported':'')+'">'+esc(w.n)+'<small>'+(c?'gemeldet '+tm(c.t):'Plan ca. '+tm(startOf(phase)+w.off*60000))+'</small></button>'}).join('');
}
function showPanel(){
  var ph=panelPhase();
  var el=document.getElementById('teacher');
  el.innerHTML='<section class="sign yellow panel" aria-label="Lehrkraft-Bereich"><div class="in"><div class="stack" style="gap:4px"><h2>Nur für Lehrkräfte</h2><p class="lead">Diese Tafel sehen nur Personen, die die Seite bearbeiten dürfen. Jede Meldung aktualisiert die Seite sofort für alle.</p></div>'+
  '<div class="row"><label for="t-phase">Fahrt<select id="t-phase"><option value="hin">Hinfahrt</option><option value="rueck">Rückfahrt</option></select></label>'+
  '<label for="t-var">Weg ab Parma<select id="t-var"><option value="cisa">über La Spezia (A15)</option><option value="bologna">über Bologna und Florenz (A1)</option></select></label>'+
  '<label for="t-time">Uhrzeit der Meldung (leer = jetzt)<input type="time" id="t-time"></label></div>'+
  '<div class="stack" style="gap:6px"><p class="lead">Hier sind wir gerade:</p><div class="wpgrid" id="t-wps"></div></div>'+
  '<div class="actions"><button type="button" id="t-undo">Letzte Meldung löschen</button></div>'+
  '<div class="row"><label for="t-msg">Nachricht an alle, erscheint als Leuchtanzeige (z. B. „Pause bis 03:30 an der Raststätte“)<input id="t-msg" maxlength="160"></label></div>'+
  '<div class="actions"><button type="button" class="dark" id="t-msg-save">Nachricht anzeigen</button><button type="button" id="t-msg-clear">Nachricht entfernen</button></div>'+
  '<div class="row"><label for="t-gps">Link zum Live-Standort (z. B. Google Maps „Standort teilen“)<input id="t-gps" type="url" placeholder="https://maps.app.goo.gl/…"></label></div>'+
  '<div class="actions"><button type="button" class="dark" id="t-gps-save">Link speichern</button><button type="button" id="t-gps-clear">Link entfernen</button></div>'+
  '<p id="t-status" role="status"></p></div></section>';
  var sel=document.getElementById('t-phase');sel.value=ph;
  var vs=document.getElementById('t-var');vs.value=state.variant[ph];
  document.getElementById('t-msg').value=state.message;
  document.getElementById('t-gps').value=state.gpsLink;
  try{var d=JSON.parse(sessionStorage.getItem('tl-draft')||'null');sessionStorage.removeItem('tl-draft');if(d){if(d.msg&&d.msg!==state.message)document.getElementById('t-msg').value=d.msg;if(d.gps&&d.gps!==state.gpsLink)document.getElementById('t-gps').value=d.gps}}catch(e){}
  renderWps();
  sel.addEventListener('change',function(){vs.value=state.variant[sel.value];renderWps()});
  vs.addEventListener('change',function(){var p=sel.value,v=vs.value;save(function(n){n.variant[p]=v})});
  document.getElementById('t-wps').addEventListener('click',function(ev){
    var b=ev.target.closest('button[data-wp]');if(!b)return;
    var p=sel.value,wp=b.getAttribute('data-wp'),t=pickTime();
    save(function(n){n.checkins=n.checkins.filter(function(c){return !(c.phase===p&&c.wp===wp)});n.checkins.push({phase:p,wp:wp,t:t});if(n.checkins.length>80)n.checkins=n.checkins.slice(-80)});
  });
  document.getElementById('t-undo').addEventListener('click',function(){
    var p=sel.value,list=state.checkins.filter(function(c){return c.phase===p});
    if(!list.length){setStatus('Für diese Fahrt gibt es noch keine Meldung.');return}
    var last=list.reduce(function(a,b){return b.t>a.t?b:a});
    save(function(n){n.checkins=n.checkins.filter(function(c){return !(c.phase===last.phase&&c.wp===last.wp&&c.t===last.t)})});
  });
  document.getElementById('t-msg-save').addEventListener('click',function(){var m=document.getElementById('t-msg').value.trim().slice(0,160);if(!m){setStatus('Die Nachricht ist leer.');return}save(function(n){n.message=m;n.messageAt=Date.now()})});
  document.getElementById('t-msg-clear').addEventListener('click',function(){save(function(n){n.message='';n.messageAt=null})});
  document.getElementById('t-gps-save').addEventListener('click',function(){var g=document.getElementById('t-gps').value.trim();if(!/^https:\/\/[^\s"'<>]+$/.test(g)){setStatus('Bitte einen vollständigen Link einfügen, der mit https:// beginnt.');return}save(function(n){n.gpsLink=g})});
  document.getElementById('t-gps-clear').addEventListener('click',function(){save(function(n){n.gpsLink=''})});
}
if(window.claude&&typeof window.claude.use==='function'){
  Promise.all([window.claude.use('artifact').catch(function(){return null}),window.claude.use('user').catch(function(){return null})]).then(function(res){
    art=res[0];var u=res[1];
    if(!art||!u)return;
    return u.canEdit().then(function(ok){if(ok)showPanel()});
  }).catch(function(){});
}
})();
