name: iOS-App bauen

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Bauen (unsigniert)
        run: |
          xcodebuild -project ios/BusSender.xcodeproj -target BusSender \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/BusSender.app Payload/
          zip -qry BusSender.ipa Payload
          ls -la BusSender.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BusSender-ipa
          path: BusSender.ipa

      - name: Als Release bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app BusSender.ipa \
            --title "Bus-Sender (iOS-App)" \
            --notes "Unsignierte App. Mit Sideloadly (Windows) oder über Xcode auf das eigene iPhone installieren." \
            --target "$GITHUB_SHA"
